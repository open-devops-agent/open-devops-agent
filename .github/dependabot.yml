version: 2
updates:
  # Python dependencies are pinned with hashes in requirements.lock and
  # refreshed by .github/workflows/lock-refresh.yml (#121), so Dependabot only
  # manages GitHub Actions and base images here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/middleware"
    schedule:
      interval: "weekly"
