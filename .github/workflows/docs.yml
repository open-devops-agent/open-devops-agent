name: Documentation

on:
  pull_request:
    paths: ['docs/**', '*.md', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/docs_site.py', 'scripts/check_docs_links.py', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', '*.md', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/docs_site.py', 'scripts/check_docs_links.py', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - run: python scripts/check_docs_links.py
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'open-devops-agent/open-devops-agent' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
