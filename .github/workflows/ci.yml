name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pylint
          pip install -r requirements.txt

      - name: Run Black
        run: black --check .
        continue-on-error: true

      - name: Run Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: Test Agent with Dummy Data
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Create dummy .env file
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=dummy-key-for-testing
          SLACK_WEBHOOK_URL=https://hooks.slack.com/services/dummy/webhook/url
          SLACK_APPROVAL_CHANNEL=test-approvals
          GITHUB_TOKEN=ghp_dummy_token_for_testing
          AUTO_APPLY=false
          MAX_AGENT_STEPS=10
          ALLOWED_NAMESPACES=default,test
          GITLAB_TOKEN=dummy-gitlab-token
          JENKINS_URL=http://jenkins.test
          JENKINS_USERNAME=test
          JENKINS_API_TOKEN=dummy
          BAMBOO_URL=http://bamboo.test
          BAMBOO_USERNAME=test
          BAMBOO_PASSWORD=dummy
          AZURE_DEVOPS_ORG=test-org
          AZURE_DEVOPS_PAT=dummy
          ARGOCD_SERVER_URL=argocd.test
          ARGOCD_AUTH_TOKEN=dummy
          AWS_ACCESS_KEY_ID=dummy
          AWS_SECRET_ACCESS_KEY=dummy
          AWS_REGION=us-east-1
          GCP_PROJECT_ID=test-project
          AZURE_SUBSCRIPTION_ID=dummy
          AZURE_TENANT_ID=dummy
          AZURE_CLIENT_ID=dummy
          AZURE_CLIENT_SECRET=dummy
          EOF

      - name: Run Unit Tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
        env:
          TESTING: true

      - name: Upload Coverage
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-collectors:
    name: Test Collectors with Dummy Data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Create test environment
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=sk-ant-dummy-key-123
          GITHUB_TOKEN=ghp_dummy_token
          SLACK_WEBHOOK_URL=https://hooks.slack.com/dummy
          EOF

      - name: Test K8s Collector (Mock)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from collectors.k8s import K8sCollector

          collector = K8sCollector()
          print('K8s Collector initialized successfully')
          print('✓ K8s collector test passed')
          "

      - name: Test GitHub Collector (Mock)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from collectors.github import GitHubCollector

          collector = GitHubCollector()
          print('GitHub Collector initialized successfully')
          print('✓ GitHub collector test passed')
          "

      - name: Test GitLab Collector (Mock)
        run: |
          python -c "
          import sys
          import os
          sys.path.insert(0, '.')
          os.environ['GITLAB_TOKEN'] = 'dummy-token'
          from collectors.gitlab import GitLabCollector

          collector = GitLabCollector()
          assert collector.token, 'GitLab collector did not read GITLAB_TOKEN'
          print('GitLab Collector initialized successfully')
          print('✓ GitLab collector test passed')
          "

      - name: Test ArgoCD Collector (Mock)
        run: |
          python -c "
          import sys
          import os
          sys.path.insert(0, '.')
          os.environ['ARGOCD_SERVER_URL'] = 'argocd.test'
          os.environ['ARGOCD_AUTH_TOKEN'] = 'dummy-token'
          from collectors.argocd import ArgoCDCollector

          collector = ArgoCDCollector()
          assert collector.server_url == 'argocd.test', 'ArgoCD collector did not read ARGOCD_SERVER_URL'
          assert collector.auth_token == 'dummy-token', 'ArgoCD collector did not read ARGOCD_AUTH_TOKEN'
          print('ArgoCD Collector initialized successfully')
          print('✓ ArgoCD collector test passed')
          "

  test-tools:
    name: Test Tools with Dummy Data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Test Safe Executor
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from tools.executor import SafeExecutor

          executor = SafeExecutor()

          # Test _classify: read-only commands are safe
          assert executor._classify('kubectl get pods') == 'safe', 'Expected safe'
          assert executor._classify('kubectl describe pod myapp') == 'safe', 'Expected safe'
          assert executor._classify('kubectl logs myapp') == 'safe', 'Expected safe'
          print('✓ Safe executor classify safe commands test passed')

          # Test _classify: mutating commands require approval (AUTO_APPLY=false by default)
          assert executor._classify('kubectl delete pod myapp') == 'requires_approval', 'Expected requires_approval'
          assert executor._classify('kubectl exec myapp -- bash') == 'requires_approval', 'Expected requires_approval'
          assert executor._classify('rm -rf /tmp/test') == 'requires_approval', 'Expected requires_approval'
          print('✓ Safe executor classify dangerous commands test passed')

          # Test _classify: allowed-with-auto-apply commands
          assert executor._classify('kubectl rollout restart deployment/myapp') == 'allowed', 'Expected allowed'
          assert executor._classify('kubectl apply -f manifest.yaml') == 'allowed', 'Expected allowed'
          print('✓ Safe executor classify allowed commands test passed')

          # Test run_safe blocks requires_approval commands when AUTO_APPLY=false
          import asyncio
          async def test_run_safe():
              result = await executor.run_safe('kubectl delete pod myapp')
              assert result.get('blocked') == True, f'Expected blocked=True, got: {result}'
              assert result.get('requires_approval') == True, 'Expected requires_approval=True'
              assert 'approval_payload' in result, 'Expected approval_payload in result'
              print('✓ Safe executor run_safe blocks dangerous commands test passed')

              result = await executor.run_safe('kubectl apply -f manifest.yaml')
              assert result.get('blocked') == True, f'Expected blocked when AUTO_APPLY=false, got: {result}'
              print('✓ Safe executor run_safe blocks allowed commands without AUTO_APPLY test passed')

          asyncio.run(test_run_safe())
          "

      - name: Test K8s Tools (Mock)
        run: |
          python -c "
          import sys
          import asyncio
          sys.path.insert(0, '.')
          from tools.k8s_tools import K8sTools

          async def test():
              tools = K8sTools()
              print('K8sTools initialized successfully')

              # Test namespace not in ALLOWED_NAMESPACES is blocked
              result = tools._check_namespace('not-allowed-ns')
              if result:
                  assert result['blocked'] == True
                  print('✓ K8s tools namespace block test passed')
              else:
                  print('✓ K8s tools namespace check passed (namespace allowed)')

              # Test allowed namespace passes check
              result = tools._check_namespace('default')
              assert result is None, f'Expected None for allowed namespace, got: {result}'
              print('✓ K8s tools allowed namespace test passed')

          asyncio.run(test())
          "

  integration-test:
    name: Integration Test - Full Agent Flow
    runs-on: ubuntu-latest
    env:
      WEBHOOK_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Create test configuration
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=sk-ant-dummy-key-for-integration-test
          SLACK_WEBHOOK_URL=https://hooks.slack.com/services/dummy
          GITHUB_TOKEN=ghp_dummy
          AUTO_APPLY=false
          TESTING=true
          EOF

      - name: Start API Server (Background)
        run: |
          uvicorn api.server:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          TESTING: true
          API_ADMIN_TOKEN: ci-admin-token

      - name: Test Health Endpoint
        run: |
          curl -f http://localhost:8000/health || exit 1
          echo "✓ Health endpoint test passed"

      - name: Test Manual Webhook - K8s Incident (Dummy)
        run: |
          payload='{
              "type": "k8s",
              "namespace": "test",
              "pod_name": "dummy-pod",
              "labels": {"severity": "warning", "test": "true"}
            }'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')"
          body_file=$(mktemp)
          status=$(curl -sS -o "$body_file" -w '%{http_code}' -X POST http://localhost:8000/webhook/manual \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $signature" \
            --data-binary "$payload") || { echo "curl failed (HTTP ${status:-none})"; exit 1; }
          body=$(cat "$body_file")
          if [ "$status" != "200" ] || ! jq -e --arg type k8s \
            '.status == "queued" and (.incident_id | type == "string" and length > 0) and .context.type == $type and .context.source == "manual"' \
            <<<"$body" >/dev/null; then
            echo "::error::Unexpected response: HTTP $status, body: $body"
            exit 1
          fi
          echo "✓ K8s manual webhook queued: $body"

      - name: Test Manual Webhook - CI/CD Incident (Dummy)
        run: |
          payload='{
              "type": "cicd",
              "source": "github_actions",
              "repo": "test/repo",
              "run_id": 12345,
              "labels": {"test": "true"}
            }'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')"
          body_file=$(mktemp)
          status=$(curl -sS -o "$body_file" -w '%{http_code}' -X POST http://localhost:8000/webhook/manual \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $signature" \
            --data-binary "$payload") || { echo "curl failed (HTTP ${status:-none})"; exit 1; }
          body=$(cat "$body_file")
          if [ "$status" != "200" ] || ! jq -e --arg type cicd \
            '.status == "queued" and (.incident_id | type == "string" and length > 0) and .context.type == $type and .context.source == "manual"' \
            <<<"$body" >/dev/null; then
            echo "::error::Unexpected response: HTTP $status, body: $body"
            exit 1
          fi
          echo "✓ CI/CD manual webhook queued: $body"

      - name: Test Manual Webhook - ArgoCD Incident (Dummy)
        run: |
          payload='{
              "type": "argocd",
              "app_name": "test-app",
              "labels": {"test": "true"}
            }'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')"
          body_file=$(mktemp)
          status=$(curl -sS -o "$body_file" -w '%{http_code}' -X POST http://localhost:8000/webhook/manual \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $signature" \
            --data-binary "$payload") || { echo "curl failed (HTTP ${status:-none})"; exit 1; }
          body=$(cat "$body_file")
          if [ "$status" != "200" ] || ! jq -e --arg type argocd \
            '.status == "queued" and (.incident_id | type == "string" and length > 0) and .context.type == $type and .context.source == "manual"' \
            <<<"$body" >/dev/null; then
            echo "::error::Unexpected response: HTTP $status, body: $body"
            exit 1
          fi
          echo "✓ ArgoCD manual webhook queued: $body"

      - name: Test Manual Webhook - Missing Type Rejected
        run: |
          payload='{"namespace": "test", "labels": {"test": "true"}}'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')"
          body_file=$(mktemp)
          status=$(curl -sS -o "$body_file" -w '%{http_code}' -X POST http://localhost:8000/webhook/manual \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $signature" \
            --data-binary "$payload") || { echo "curl failed (HTTP ${status:-none})"; exit 1; }
          body=$(cat "$body_file")
          if [ "$status" != "400" ] || ! jq -e --arg detail "'type' field required" '.detail == $detail' <<<"$body" >/dev/null; then
            echo "::error::Unexpected response: HTTP $status, body: $body"
            exit 1
          fi
          echo "✓ Missing type rejected: $body"

      - name: Test Manual Webhook - Invalid JSON Rejected
        run: |
          payload='not json'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')"
          body_file=$(mktemp)
          status=$(curl -sS -o "$body_file" -w '%{http_code}' -X POST http://localhost:8000/webhook/manual \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $signature" \
            --data-binary "$payload") || { echo "curl failed (HTTP ${status:-none})"; exit 1; }
          body=$(cat "$body_file")
          if [ "$status" != "400" ] || ! jq -e --arg detail "JSON object required" '.detail == $detail' <<<"$body" >/dev/null; then
            echo "::error::Unexpected response: HTTP $status, body: $body"
            exit 1
          fi
          echo "✓ Invalid JSON rejected: $body"

      - name: Check Audit Endpoint
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/audit)
          if [ "$status" != "401" ]; then
            echo "::error::Unauthenticated /audit returned HTTP $status, expected 401"
            exit 1
          fi
          curl -f -H "Authorization: Bearer ci-admin-token" http://localhost:8000/audit || exit 1
          echo "✓ Audit endpoint requires a token and works with one"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Safety Check
        run: |
          pip install -r requirements.txt
          safety check || true

      - name: Run Bandit Security Scan
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -ll

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Images
        run: |
          docker build -t devops-ai-agent:test -f docker/Dockerfile .
          docker build -t devops-agent-middleware:test middleware/

      - name: Test Docker Images
        run: |
          docker run --rm devops-ai-agent:test python --version
          docker run --rm devops-ai-agent:test pip list | grep anthropic
          docker run --rm devops-ai-agent:test kubectl version --client
          docker run --rm devops-agent-middleware:test python -c "import app"

      # Trivy from its official image (pinned). Fails on HIGH/CRITICAL
      # vulnerabilities that have a fix available; accepted risks go in
      # .trivyignore.yaml, scoped to a path, with a reason and an expiry.
      - name: Scan images for vulnerabilities
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.1
        run: |
          mkdir -p sbom "$HOME/.cache/trivy"
          status=0
          for image in devops-ai-agent:test devops-agent-middleware:test; do
            echo "::group::Trivy $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              -v "$PWD:/work" -w /work \
              "$TRIVY_IMAGE" image --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile .trivyignore.yaml --exit-code 1 --no-progress "$image" \
              || { status=1; echo "::error::Trivy found fixable HIGH/CRITICAL vulnerabilities in $image"; }
            echo "::endgroup::"
          done
          exit $status

      - name: Generate SBOMs (CycloneDX)
        if: always()
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.1
        run: |
          mkdir -p sbom
          for pair in devops-ai-agent:test=agent devops-agent-middleware:test=middleware; do
            image="${pair%%=*}"; name="${pair##*=}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              -v "$PWD/sbom:/sbom" \
              "$TRIVY_IMAGE" image --format cyclonedx --output "/sbom/$name.cdx.json" --no-progress "$image"
          done
          ls -l sbom

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          retention-days: 30

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check Required Files
        run: |
          test -f README.md && echo "✓ README.md exists"
          test -f LICENSE && echo "✓ LICENSE exists"
          test -f .env.example && echo "✓ .env.example exists"
          test -f requirements.txt && echo "✓ requirements.txt exists"
          test -f CONTRIBUTING.md && echo "✓ CONTRIBUTING.md exists"
          test -f docs/MULTI_PLATFORM_GUIDE.md && echo "✓ docs/MULTI_PLATFORM_GUIDE.md exists"

      - name: Check Python Documentation
        run: |
          python -m pip install pydocstyle
          pydocstyle agent/ || true
          pydocstyle collectors/ || true
          pydocstyle tools/ || true