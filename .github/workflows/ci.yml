name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pylint
          pip install -r requirements.txt

      - name: Run Black
        run: black --check .
        continue-on-error: true

      - name: Run Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: Test Agent with Dummy Data
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Create dummy .env file
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=dummy-key-for-testing
          SLACK_WEBHOOK_URL=https://hooks.slack.com/services/dummy/webhook/url
          SLACK_APPROVAL_CHANNEL=test-approvals
          GITHUB_TOKEN=ghp_dummy_token_for_testing
          AUTO_APPLY=false
          MAX_AGENT_STEPS=10
          ALLOWED_NAMESPACES=default,test
          GITLAB_TOKEN=dummy-gitlab-token
          JENKINS_URL=http://jenkins.test
          JENKINS_USERNAME=test
          JENKINS_API_TOKEN=dummy
          BAMBOO_URL=http://bamboo.test
          BAMBOO_USERNAME=test
          BAMBOO_PASSWORD=dummy
          AZURE_DEVOPS_ORG=test-org
          AZURE_DEVOPS_PAT=dummy
          ARGOCD_SERVER_URL=argocd.test
          ARGOCD_AUTH_TOKEN=dummy
          AWS_ACCESS_KEY_ID=dummy
          AWS_SECRET_ACCESS_KEY=dummy
          AWS_REGION=us-east-1
          GCP_PROJECT_ID=test-project
          AZURE_SUBSCRIPTION_ID=dummy
          AZURE_TENANT_ID=dummy
          AZURE_CLIENT_ID=dummy
          AZURE_CLIENT_SECRET=dummy
          EOF

      - name: Run Unit Tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
        env:
          TESTING: true

      - name: Upload Coverage
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-collectors:
    name: Test Collectors with Dummy Data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Create test environment
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=sk-ant-dummy-key-123
          GITHUB_TOKEN=ghp_dummy_token
          SLACK_WEBHOOK_URL=https://hooks.slack.com/dummy
          EOF

      - name: Test K8s Collector (Mock)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from collectors.k8s import K8sCollector

          collector = K8sCollector()
          print('K8s Collector initialized successfully')
          print('✓ K8s collector test passed')
          "

      - name: Test GitHub Collector (Mock)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from collectors.github import GitHubCollector

          collector = GitHubCollector()
          print('GitHub Collector initialized successfully')
          print('✓ GitHub collector test passed')
          "

      - name: Test GitLab Collector (Mock)
        run: |
          python -c "
          import sys
          import os
          sys.path.insert(0, '.')
          os.environ['GITLAB_TOKEN'] = 'dummy-token'
          from collectors.gitlab import GitLabCollector

          collector = GitLabCollector()
          assert collector.token, 'GitLab collector did not read GITLAB_TOKEN'
          print('GitLab Collector initialized successfully')
          print('✓ GitLab collector test passed')
          "

      - name: Test ArgoCD Collector (Mock)
        run: |
          python -c "
          import sys
          import os
          sys.path.insert(0, '.')
          os.environ['ARGOCD_SERVER_URL'] = 'argocd.test'
          os.environ['ARGOCD_AUTH_TOKEN'] = 'dummy-token'
          from collectors.argocd import ArgoCDCollector

          collector = ArgoCDCollector()
          assert collector.server_url == 'argocd.test', 'ArgoCD collector did not read ARGOCD_SERVER_URL'
          assert collector.auth_token == 'dummy-token', 'ArgoCD collector did not read ARGOCD_AUTH_TOKEN'
          print('ArgoCD Collector initialized successfully')
          print('✓ ArgoCD collector test passed')
          "

  test-tools:
    name: Test Tools with Dummy Data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Test Safe Executor
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from tools.executor import SafeExecutor

          executor = SafeExecutor()

          # Test _classify: read-only commands are safe
          assert executor._classify('kubectl get pods') == 'safe', 'Expected safe'
          assert executor._classify('kubectl describe pod myapp') == 'safe', 'Expected safe'
          assert executor._classify('kubectl logs myapp') == 'safe', 'Expected safe'
          print('✓ Safe executor classify safe commands test passed')

          # Test _classify: destructive commands are permanently blocked (never run, even if approved)
          assert executor._classify('kubectl delete pod myapp') == 'blocked', 'Expected blocked'
          assert executor._classify('rm -rf /tmp/test') == 'blocked', 'Expected blocked'
          assert executor._classify('uptime && kubectl delete ns prod') == 'blocked', 'Expected blocked'
          print('✓ Safe executor classify destructive commands test passed')

          # Test _classify: other mutating or unknown commands require approval
          assert executor._classify('kubectl exec myapp -- bash') == 'requires_approval', 'Expected requires_approval'
          assert executor._classify('shutdown -h now') == 'requires_approval', 'Expected requires_approval'
          assert executor._classify('journalctl -n 5 | sh') == 'requires_approval', 'Expected requires_approval'
          print('✓ Safe executor classify dangerous commands test passed')

          # Test _classify: allowed-with-auto-apply commands
          assert executor._classify('kubectl rollout restart deployment/myapp') == 'allowed', 'Expected allowed'
          assert executor._classify('kubectl apply -f manifest.yaml') == 'allowed', 'Expected allowed'
          print('✓ Safe executor classify allowed commands test passed')

          # Test run_safe blocks requires_approval commands when AUTO_APPLY=false
          import asyncio
          async def test_run_safe():
              result = await executor.run_safe('kubectl delete pod myapp')
              assert result.get('permanently_blocked') == True, f'Expected permanently_blocked, got: {result}'
              assert result.get('requires_approval') == False, 'Destructive commands are not approvable'
              assert 'approval_payload' not in result, 'Expected no approval_payload'
              print('✓ Safe executor run_safe permanently blocks destructive commands test passed')

              result = await executor.run_safe('kubectl exec myapp -- bash')
              assert result.get('blocked') == True, f'Expected blocked=True, got: {result}'
              assert result.get('requires_approval') == True, 'Expected requires_approval=True'
              assert 'approval_payload' in result, 'Expected approval_payload in result'
              print('✓ Safe executor run_safe blocks dangerous commands test passed')

              result = await executor.run_safe('kubectl apply -f manifest.yaml')
              assert result.get('blocked') == True, f'Expected blocked when AUTO_APPLY=false, got: {result}'
              print('✓ Safe executor run_safe blocks allowed commands without AUTO_APPLY test passed')

          asyncio.run(test_run_safe())
          "

      - name: Test K8s Tools (Mock)
        run: |
          python -c "
          import sys
          import asyncio
          sys.path.insert(0, '.')
          from tools.k8s_tools import K8sTools

          async def test():
              tools = K8sTools()
              print('K8sTools initialized successfully')

              # Test namespace not in ALLOWED_NAMESPACES is blocked
              result = tools._check_namespace('not-allowed-ns')
              if result:
                  assert result['blocked'] == True
                  print('✓ K8s tools namespace block test passed')
              else:
                  print('✓ K8s tools namespace check passed (namespace allowed)')

              # Test allowed namespace passes check
              result = tools._check_namespace('default')
              assert result is None, f'Expected None for allowed namespace, got: {result}'
              print('✓ K8s tools allowed namespace test passed')

          asyncio.run(test())
          "

  integration-test:
    name: Integration Test - Full Agent Flow
    runs-on: ubuntu-latest
    env:
      # Dummy secret for this job only: the server verifies every webhook
      # request against it, and the test steps sign with it.
      WEBHOOK_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Create test configuration
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=sk-ant-dummy-key-for-integration-test
          SLACK_WEBHOOK_URL=https://hooks.slack.com/services/dummy
          GITHUB_TOKEN=ghp_dummy
          AUTO_APPLY=false
          TESTING=true
          EOF

      - name: Start API Server (Background)
        run: |
          uvicorn api.server:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          TESTING: true
          API_ADMIN_TOKEN: ci-admin-token

      - name: Test Health Endpoint
        run: |
          curl -f http://localhost:8000/health || exit 1
          echo "✓ Health endpoint test passed"

      - name: Define Webhook Test Helpers
        run: |
          cat > "$RUNNER_TEMP/webhook_helpers.sh" << 'EOF'
          # send <path> <body> [extra curl args...]: sets $status and $body.
          # --data-binary sends the body byte-for-byte, so it matches what was signed.
          send() {
            local path=$1 data=$2 body_file
            shift 2
            body_file=$(mktemp)
            status=$(curl -sS -o "$body_file" -w '%{http_code}' -X POST "http://localhost:8000$path" \
              -H "Content-Type: application/json" "$@" --data-binary "$data") || { echo "curl failed (HTTP ${status:-none})"; exit 1; }
            body=$(cat "$body_file")
          }
          # sign <body>: hex HMAC-SHA256 of the body with WEBHOOK_SECRET
          sign() {
            printf '%s' "$1" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r | cut -d' ' -f1
          }
          # post <path> <body> [extra curl args...]: signed with X-Hub-Signature-256
          post() {
            local path=$1 data=$2
            shift 2
            send "$path" "$data" -H "X-Hub-Signature-256: sha256=$(sign "$data")" "$@"
          }
          # post_bearer <path> <body> [extra curl args...]: Alertmanager and Grafana
          # cannot sign bodies, so they send WEBHOOK_SECRET as a bearer token
          post_bearer() {
            local path=$1 data=$2
            shift 2
            send "$path" "$data" -H "Authorization: Bearer $WEBHOOK_SECRET" "$@"
          }
          # expect <label> <http status> <jq filter that must be true>
          expect() {
            if [ "$status" != "$2" ] || ! jq -e "$3" <<<"$body" >/dev/null; then
              echo "::error::$1: unexpected response: HTTP $status, body: $body"
              exit 1
            fi
            echo "✓ $1: $body"
          }
          QUEUED='.status == "queued" and (.incident_id | type == "string" and length > 0)'
          INVALID_JSON='.detail == "JSON object required"'
          UNAUTHORIZED='.detail == "Invalid signature"'
          EOF

      - name: Test Webhook Authentication
        run: |
          source "$RUNNER_TEMP/webhook_helpers.sh"
          incident='{"type": "k8s", "namespace": "test", "labels": {"test": "true"}}'
          send /webhook/manual "$incident"
          expect "Unsigned request rejected" 401 "$UNAUTHORIZED"
          send /webhook/manual "$incident" -H "X-Hub-Signature-256: sha256=$(printf '0%.0s' {1..64})"
          expect "Wrong signature rejected" 401 "$UNAUTHORIZED"
          send /webhook/manual '{"type": "k8s", "namespace": "tampered"}' -H "X-Hub-Signature-256: sha256=$(sign "$incident")"
          expect "Signature for a different body rejected" 401 "$UNAUTHORIZED"
          send /webhook/alertmanager '{"alerts": []}' -H "Authorization: Bearer wrong-token"
          expect "Wrong bearer token rejected" 401 "$UNAUTHORIZED"

      - name: Test Manual Webhook
        run: |
          source "$RUNNER_TEMP/webhook_helpers.sh"
          manual_queued() {
            expect "$1" 200 "$QUEUED and .context.type == \"$2\" and .context.source == \"manual\""
          }
          post /webhook/manual '{"type": "k8s", "namespace": "test", "pod_name": "dummy-pod", "labels": {"severity": "warning", "test": "true"}}'
          manual_queued "K8s manual webhook queued" k8s
          post /webhook/manual '{"type": "cicd", "source": "github_actions", "repo": "test/repo", "run_id": 12345, "labels": {"test": "true"}}'
          manual_queued "CI/CD manual webhook queued" cicd
          post /webhook/manual '{"type": "argocd", "app_name": "test-app", "labels": {"test": "true"}}'
          manual_queued "ArgoCD manual webhook queued" argocd
          post /webhook/manual '{"namespace": "test", "labels": {"test": "true"}}'
          expect "Missing type rejected" 400 ".detail == \"'type' field required\""
          post /webhook/manual 'not json'
          expect "Invalid JSON rejected" 400 "$INVALID_JSON"

      - name: Test GitHub Webhook
        run: |
          source "$RUNNER_TEMP/webhook_helpers.sh"
          post /webhook/github '{"workflow_run": {"conclusion": "failure", "id": 123, "name": "CI", "head_branch": "main", "head_sha": "abcdef1234567890"}, "repository": {"full_name": "test/repo"}}' \
            -H "X-GitHub-Event: workflow_run"
          expect "GitHub failed workflow_run queued" 200 "$QUEUED and .type == \"cicd\""
          post /webhook/github '{"action": "opened", "pull_request": {"number": 7, "title": "Test PR", "draft": false, "user": {"login": "ci"}, "base": {"ref": "main"}, "head": {"ref": "feature"}}, "repository": {"full_name": "test/repo"}}' \
            -H "X-GitHub-Event: pull_request"
          expect "GitHub opened PR queued for review" 200 "$QUEUED and .type == \"code_review\""
          post /webhook/github '{"action": "opened", "pull_request": {"number": 8, "draft": true}, "repository": {"full_name": "test/repo"}}' \
            -H "X-GitHub-Event: pull_request"
          expect "GitHub draft PR ignored" 200 '.status == "ignored" and .reason == "draft_pr"'
          post /webhook/github '{"ref": "refs/heads/main"}' -H "X-GitHub-Event: push"
          expect "GitHub push event ignored" 200 '.status == "ignored" and .event == "push"'
          post /webhook/github 'not json' -H "X-GitHub-Event: push"
          expect "GitHub invalid JSON rejected" 400 "$INVALID_JSON"

      - name: Test GitLab Webhook
        run: |
          source "$RUNNER_TEMP/webhook_helpers.sh"
          post /webhook/gitlab '{"object_kind": "pipeline", "object_attributes": {"id": 99, "status": "failed"}, "project": {"id": 42}}' \
            -H "X-Gitlab-Event: Pipeline Hook"
          expect "GitLab failed pipeline queued" 200 "$QUEUED and .type == \"cicd\""
          post /webhook/gitlab '{"object_kind": "merge_request", "object_attributes": {"action": "open", "iid": 5, "state": "opened", "title": "Test MR", "target_branch": "main", "source_branch": "feature"}, "project": {"id": 42}, "user": {"username": "ci"}}' \
            -H "X-Gitlab-Event: Merge Request Hook"
          expect "GitLab opened MR queued for review" 200 "$QUEUED and .type == \"code_review\""
          post /webhook/gitlab '{"object_kind": "pipeline", "object_attributes": {"id": 100, "status": "success"}, "project": {"id": 42}}' \
            -H "X-Gitlab-Event: Pipeline Hook"
          expect "GitLab successful pipeline ignored" 200 '.status == "ignored" and .event == "pipeline hook"'
          post /webhook/gitlab 'not json' -H "X-Gitlab-Event: Pipeline Hook"
          expect "GitLab invalid JSON rejected" 400 "$INVALID_JSON"

      - name: Test Bitbucket Webhook
        run: |
          source "$RUNNER_TEMP/webhook_helpers.sh"
          post /webhook/bitbucket '{"pullrequest": {"id": 3, "state": "OPEN", "title": "Test PR", "author": {"display_name": "ci"}, "destination": {"branch": {"name": "main"}}, "source": {"branch": {"name": "feature"}}}, "repository": {"slug": "repo", "workspace": {"slug": "test"}}}' \
            -H "X-Event-Key: pullrequest:created"
          expect "Bitbucket created PR queued for review" 200 "$QUEUED and .type == \"code_review\""
          post /webhook/bitbucket '{}' -H "X-Event-Key: repo:push"
          expect "Bitbucket unsupported event ignored" 200 '.status == "ignored" and .reason == "unsupported_event" and .event == "repo:push"'
          post /webhook/bitbucket 'not json' -H "X-Event-Key: pullrequest:created"
          expect "Bitbucket invalid JSON rejected" 400 "$INVALID_JSON"

      - name: Test Alertmanager Webhook
        run: |
          source "$RUNNER_TEMP/webhook_helpers.sh"
          alert='{"alerts": [{"status": "firing", "labels": {"alertname": "CIPodCrashLooping", "namespace": "test", "pod": "dummy-pod"}, "annotations": {"summary": "CI test alert"}, "startsAt": "2026-01-01T00:00:00Z"}]}'
          post_bearer /webhook/alertmanager "$alert"
          expect "Alertmanager firing alert queued" 200 '.status == "queued" and (.incident_ids | length == 1)'
          first_id=$(jq -r '.incident_ids[0]' <<<"$body")
          post_bearer /webhook/alertmanager "$alert"
          expect "Alertmanager repeated alert deduplicated" 200 \
            ".status == \"duplicate\" and .incident_ids == [] and .duplicate_of == [\"$first_id\"]"
          post_bearer /webhook/alertmanager 'not json'
          expect "Alertmanager invalid JSON rejected" 400 "$INVALID_JSON"

      - name: Test Grafana Webhook
        run: |
          source "$RUNNER_TEMP/webhook_helpers.sh"
          post_bearer /webhook/grafana '{"alerts": [{"status": "firing", "labels": {"alertname": "CIHighErrorRate", "service": "api"}, "annotations": {"summary": "CI test alert"}, "startsAt": "2026-01-01T00:00:00Z", "dashboardURL": "http://grafana.local/d/ci", "panelURL": "http://grafana.local/d/ci?viewPanel=1"}]}'
          expect "Grafana firing alert queued" 200 '.status == "queued" and (.incident_ids | length == 1)'
          post_bearer /webhook/grafana 'not json'
          expect "Grafana invalid JSON rejected" 400 "$INVALID_JSON"

      - name: Check Audit Endpoint
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/audit)
          if [ "$status" != "401" ]; then
            echo "::error::Unauthenticated /audit returned HTTP $status, expected 401"
            exit 1
          fi
          curl -f -H "Authorization: Bearer ci-admin-token" http://localhost:8000/audit || exit 1
          echo "✓ Audit endpoint requires a token and works with one"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Safety Check
        run: |
          pip install -r requirements.txt
          safety check || true

      - name: Run Bandit Security Scan
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -ll

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Images
        run: |
          docker build -t devops-ai-agent:test -f docker/Dockerfile .
          docker build -t devops-agent-middleware:test middleware/

      - name: Test Docker Images
        run: |
          docker run --rm devops-ai-agent:test python --version
          docker run --rm devops-ai-agent:test pip list | grep anthropic
          docker run --rm devops-ai-agent:test kubectl version --client
          docker run --rm devops-agent-middleware:test python -c "import app"

      # Trivy from its official image (pinned). Fails on HIGH/CRITICAL
      # vulnerabilities that have a fix available; accepted risks go in
      # .trivyignore.yaml, scoped to a path, with a reason and an expiry.
      - name: Scan images for vulnerabilities
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.1
        run: |
          mkdir -p sbom "$HOME/.cache/trivy"
          status=0
          for image in devops-ai-agent:test devops-agent-middleware:test; do
            echo "::group::Trivy $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              -v "$PWD:/work" -w /work \
              "$TRIVY_IMAGE" image --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile .trivyignore.yaml --exit-code 1 --no-progress "$image" \
              || { status=1; echo "::error::Trivy found fixable HIGH/CRITICAL vulnerabilities in $image"; }
            echo "::endgroup::"
          done
          exit $status

      - name: Generate SBOMs (CycloneDX)
        if: always()
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.1
        run: |
          mkdir -p sbom
          for pair in devops-ai-agent:test=agent devops-agent-middleware:test=middleware; do
            image="${pair%%=*}"; name="${pair##*=}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              -v "$PWD/sbom:/sbom" \
              "$TRIVY_IMAGE" image --format cyclonedx --output "/sbom/$name.cdx.json" --no-progress "$image"
          done
          ls -l sbom

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          retention-days: 30

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check Required Files
        run: |
          test -f README.md && echo "✓ README.md exists"
          test -f LICENSE && echo "✓ LICENSE exists"
          test -f .env.example && echo "✓ .env.example exists"
          test -f requirements.txt && echo "✓ requirements.txt exists"
          test -f CONTRIBUTING.md && echo "✓ CONTRIBUTING.md exists"
          test -f docs/MULTI_PLATFORM_GUIDE.md && echo "✓ docs/MULTI_PLATFORM_GUIDE.md exists"

      - name: Check Python Documentation
        run: |
          python -m pip install pydocstyle
          pydocstyle agent/ || true
          pydocstyle collectors/ || true
          pydocstyle tools/ || true