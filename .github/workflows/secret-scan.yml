name: Secret Scan

# gitleaks CLI in its official image (the gitleaks GitHub Action needs a paid
# license for organization accounts). Config and allowlist: .gitleaks.toml.
#
# - pull_request / push: scan only the new commits and fail on a finding.
# - schedule / workflow_dispatch: scan the full history, report only, and
#   upload the (redacted) report as an artifact for review.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'  # weekly, Monday 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  new-commits:
    name: Gitleaks (new commits)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "log_opts=--no-merges $PR_BASE..$PR_HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            echo "log_opts=--no-merges $PUSH_BEFORE..$PUSH_AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=-1 $PUSH_AFTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git . --config .gitleaks.toml --log-opts="$LOG_OPTS" --redact --verbose

  full-history:
    name: Gitleaks (full history, report only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan full history
        run: |
          mkdir -p gitleaks-report
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git . --config .gitleaks.toml --redact --exit-code 0 \
            --report-format json --report-path gitleaks-report/full-history.json
          count=$(jq length gitleaks-report/full-history.json)
          echo "Findings in full history: $count"
          if [ "$count" != "0" ]; then
            echo "::warning::gitleaks found $count potential secret(s) in git history; see the gitleaks-full-history artifact"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-full-history
          path: gitleaks-report/
          retention-days: 14
